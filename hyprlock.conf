# /* ---- 💫 https://github.com/LinuxBeginnings 💫 ---- */  #
# Hyprlock config for < 1080p monitor resolutions                 
# Original config submitted by https://github.com/SherLock707

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    # NOTE: use only 1 path
    #path = screenshot   # screenshot of your desktop
    #path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_modified # by wallpaper effects
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current # current wallpaper
    
    color = rgb(0,0,0) # color will be rendered initially until path is available

    blur_size = 3
    blur_passes = 2 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# 1. TIME (Top)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = $color8
    font_size = 130
    font_family = JetBrainsMono Nerd Font ExtraBold 
    position = 0, -80
    halign = center
    valign = top
}

# 2. DATE (Below Time)
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = $color13
    font_size = 40 
    font_family = Victor Mono Bold Italic
    position = 0, -290
    halign = center
    valign = top
}

# 3. USERNAME (Below Date)
label {
    monitor =
    text =   $USER
    color = $color9
    font_size = 28
    font_family = Victor Mono Bold Oblique
    position = 0, -380
    halign = center
    valign = top
}

# 4. INPUT FIELD (Below Username)
input-field {
    monitor =
    size = 400, 60
    outline_thickness = 2
    dots_size = 0.2 
    dots_spacing = 0.2 
    dots_center = true
    outer_color = $color8
    inner_color = rgba(255, 255, 255, 0.1)
    capslock_color = rgb(255,255,255)
    font_color = $color13
    fade_on_empty = false
    font_family = Victor Mono Bold Oblique
    placeholder_text = <i><span foreground="##ffffff99">🔒 Type Password</span></i>
    hide_input = false
    position = 0, -470
    halign = center
    valign = top
}

# 5. KEYBOARD LAYOUT (Below Input Field)
label {
    monitor =
    text = $LAYOUT
    color = $color8
    font_size = 14
    font_family = Victor Mono Bold Oblique
    position = 0, -550
    halign = center
    valign = top
}

# 6. SYSTEM STATUS (Bottom Corner Overlays)
# Uptime
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$(uptime -p || $Scripts/UptimeNixOS.sh)" </b>"
    color = $color8
    font_size = 24
    font_family = Victor Mono Bold Oblique
    position = -30, 30
    halign = right
    valign = bottom
}

# Battery
label {
    monitor =
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = $color8
    font_size = 16
    font_family = Victor Mono Bold Oblique
    position = -30, 70
    halign = right
    valign = bottom
}

# Weather
label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = $color8
    font_size = 14
    font_family = Victor Mono Bold Oblique
    position = 30, 30
    halign = left
    valign = bottom
}
