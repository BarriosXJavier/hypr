# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


# ── Nvim docs popup ──
# Brave --app windows get class "brave-<url>-Default"; this stably isolates
# app windows from the normal browser (class "brave-browser").
# NOTE: float/size/move are STATIC effects, evaluated only at window creation.
# They cannot be triggered by tagging after the window exists, so we match on
# the creation-time class instead.
windowrule {
    name = Nvim Docs Popup
    match:class = ^(brave-.*-Default)$
    float = on
    size = (monitor_w*0.65) (monitor_h*0.65)
    move = 17.5% 5%
    no_initial_focus = on
}

#  Optional Layer rules
#  To Resolve blurred corners in rofi  Uncomment
# layerrule = blur on, ignore_alpha 0, match:namespace rofi
# Special-workspace wallpapers are fullscreen windows confined to their workspace.
windowrule {
    name = Special wallpaper
    match:class = ^(special-wallpaper-special)$
    workspace = "special:special silent"
    fullscreen = on
    no_initial_focus = on
    no_focus = on
    border_size = 0
    no_anim = on
}
windowrule {
    name = Secondary wallpaper
    match:class = ^(special-wallpaper-secondary)$
    workspace = "special:secondary silent"
    fullscreen = on
    no_initial_focus = on
    no_focus = on
    border_size = 0
    no_anim = on
}
windowrule {
    name = Tertiary wallpaper
    match:class = ^(special-wallpaper-tertiary)$
    workspace = "special:tertiary silent"
    fullscreen = on
    no_initial_focus = on
    no_focus = on
    border_size = 0
    no_anim = on
}
